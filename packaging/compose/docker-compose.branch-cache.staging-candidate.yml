# STAGING-CANDIDATE only — branch-cache mTLS package (Phase 8).
#
# Completely separate from packaging/compose/docker-compose.production.yml
# and deploy/staging/docker-compose.staging.yml.
#
# Defaults: no public ports, non-root, read-only root, cap_drop ALL,
# no-new-privileges, dedicated cache + read-only cert mounts.
# Internal network only. Does NOT activate live pilot or client redirects.
#
# Private keys/certs are bind-mounted at runtime (never baked into the image).
# Replace ./staging-candidate-fixtures/certs with operator-provisioned material
# after fingerprint review — fixtures here are placeholders for layout only.
#
# Actual staging activation is a SEPARATE explicit deployment step after
# endpoint + credential review. This file alone does not authorize it.

name: ifilm-branch-cache-staging-candidate

services:
  branch-cache-staging-candidate:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile.branch-cache.lab
    image: ifilm-branch-cache-lab:local
    user: "10001:10001"
    read_only: true
    # No host/public port publishing.
    expose: []
    networks:
      - branch_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      APP_ENV: development
      ENABLE_BRANCH_CACHE_HTTP_LAB_ARTIFACT: "true"
      ENABLE_BRANCH_CACHE_HTTP_SERVICE: "true"
      ENABLE_BRANCH_CACHE_HTTP_MTLS_STAGING_CANDIDATE: "false"
      ENABLE_BRANCH_CACHE_HTTP_HEALTH: "false"
      ENABLE_BRANCH_CACHE_HTTP_METRICS: "false"
      ENABLE_BRANCH_CACHE_HTTP_LAB_HTTPS_ADAPTER: "false"
      BRANCH_CACHE_ENTRY_MODE: validate
      BRANCH_CACHE_NODE_ID: staging-node-1
      BRANCH_CACHE_SITE_ID: staging-site
      BRANCH_CACHE_CACHE_ROOT: /var/cache/ifilm-branch
      BRANCH_CACHE_ORIGIN_ROOT: /var/lib/ifilm-branch-origin
      BRANCH_CACHE_BIND_HOST: "127.0.0.1"
      EDGE_GRANT_PUBLIC_KEY_FILE: /run/ifilm/certs/edge-grant-public.pem
      EDGE_GRANT_KEY_ID: staging
      # mTLS mount paths (material supplied at runtime — not generated by the app)
      BRANCH_CACHE_MTLS_CA_BUNDLE: /run/ifilm/certs/ca-bundle.pem
      BRANCH_CACHE_MTLS_CLIENT_CERT: /run/ifilm/certs/client.crt
      BRANCH_CACHE_MTLS_CLIENT_KEY: /run/ifilm/certs/client.key
    volumes:
      - branch_cache_data:/var/cache/ifilm-branch
      - ./staging-candidate-fixtures/origin:/var/lib/ifilm-branch-origin:ro
      - ./staging-candidate-fixtures/certs:/run/ifilm/certs:ro
      - ./staging-candidate-fixtures/enrollment.v1.json:/run/ifilm/enrollment.json:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    restart: "no"
    labels:
      ifilm.compose.profile: staging-candidate-only
      ifilm.branch_cache.phase: "8"
      ifilm.branch_cache.activation: never-default
      ifilm.branch_cache.live_pilot_ready: "false"
      ifilm.branch_cache.client_redirect_active: "false"

networks:
  branch_internal:
    # Internal network: no external connectivity by default.
    # Future reviewed staging egress to a fixed origin requires a separate change.
    internal: true
    name: ifilm-branch-staging-candidate-net

volumes:
  branch_cache_data:
    name: ifilm-branch-staging-candidate-cache
