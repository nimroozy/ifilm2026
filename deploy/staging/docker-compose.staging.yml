# iFilm staging stack (production-like). Does NOT auto-deploy.
#
# Usage:
#   cp deploy/staging/.env.staging.example deploy/staging/.env.staging
#   # fill secrets (see docs/deployment/STAGING_DEPLOYMENT.md)
#   chmod 600 deploy/staging/.env.staging
#   docker compose -f deploy/staging/docker-compose.staging.yml --env-file deploy/staging/.env.staging up -d --build
#   ./deploy/staging/scripts/migrate.sh
#   ./deploy/staging/scripts/ops_check.sh
#
# DATABASE_URL / REDIS_URL are built inside the container entrypoint from
# POSTGRES_* / REDIS_* components (passwords with @ : / # % are encoded).
# Do NOT interpolate an unescaped password into Compose YAML.

name: ifilm-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [staging_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000",
        "--requirepass",
        "${REDIS_PASSWORD:?}",
      ]
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [staging_net]

  backend-api:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: false
    environment: &api_env
      # Connection URLs are constructed by entrypoint.staging.sh (encoded).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      MEDIA_ROOT: /data/media
      ARTWORK_ROOT: /data/artwork
      # Force staging — do not interpolate host APP_ENV (agents/CI often set APP_ENV=test).
      APP_ENV: staging
      DEBUG: "false"
      JWT_SECRET: ${JWT_SECRET:?missing}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?missing}
      ENABLE_UPLOADS: ${ENABLE_UPLOADS:-true}
      ENABLE_MEDIA_PROCESSING: ${ENABLE_MEDIA_PROCESSING:-true}
      ENABLE_HLS_ENCODING: ${ENABLE_HLS_ENCODING:-true}
      ENABLE_LOCAL_STREAMING: ${ENABLE_LOCAL_STREAMING:-true}
      ENABLE_RADIUS_LOGIN: ${ENABLE_RADIUS_LOGIN:-true}
      ENABLE_CDN_SYNC: ${ENABLE_CDN_SYNC:-false}
      ENABLE_ENCODING: ${ENABLE_ENCODING:-false}
      ENABLE_WATCH_HISTORY: ${ENABLE_WATCH_HISTORY:-true}
      SUBSCRIBER_IDENTITY_MODE: ${SUBSCRIBER_IDENTITY_MODE:-fixture}
      STAGING_ALLOW_FIXTURE_AUTH: ${STAGING_ALLOW_FIXTURE_AUTH:-true}
      RADIUS_ENTITLEMENT_MAPPING_ENABLED: ${RADIUS_ENTITLEMENT_MAPPING_ENABLED:-false}
      RADIUS_ENABLED: ${RADIUS_ENABLED:-false}
      RADIUS_MODE: ${RADIUS_MODE:-mock}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      # RADIUS_MOCK_USERS / CORS_ORIGINS come from env_file (JSON) — do not interpolate here.
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      CSP_MODE: ${CSP_MODE:-production}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-staging_admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-staging-admin@example.invalid}
      HLS_PUBLIC_BASE_URL: ${HLS_PUBLIC_BASE_URL:-http://localhost:8080/api/stream}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
    volumes:
      - staging_media_originals:/data/media/originals
      - staging_media_temp:/data/media/temp
      - staging_media_trailers:/data/media/trailers
      - staging_media_subtitles:/data/media/subtitles
      - staging_media_posters:/data/media/posters
      - staging_media_backdrops:/data/media/backdrops
      - type: volume
        source: staging_media_packages
        target: /data/media/packages
        read_only: true
      - staging_artwork:/data/artwork
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "set -a; . /run/ifilm/runtime.env; set +a; curl -fsS http://127.0.0.1:8000/api/health/live",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [staging_net]

  media-processing-worker:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    command: ["python", "-m", "app.workers.media_processing"]
    env_file:
      - path: .env.staging
        required: false
    environment:
      <<: *api_env
      MEDIA_PROCESSING_WORKER_ID: ${MEDIA_PROCESSING_WORKER_ID:-staging-media-1}
    volumes:
      # Share all API upload categories (not just originals) so probe can read files.
      - staging_media_originals:/data/media/originals:ro
      - staging_media_trailers:/data/media/trailers:ro
      - staging_media_subtitles:/data/media/subtitles:ro
      - staging_media_posters:/data/media/posters:ro
      - staging_media_backdrops:/data/media/backdrops:ro
      - staging_media_packages:/data/media/packages
      - staging_media_temp:/data/media/temp
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "set -a; . /run/ifilm/runtime.env; set +a; python -c \"from app.services.media_processing.ffmpeg import binary_available; from app.core.config import get_settings; get_settings.cache_clear(); s=get_settings(); ok=binary_available(s.ffprobe_binary) and (binary_available(s.ffmpeg_binary) if s.enable_hls_encoding else True); raise SystemExit(0 if ok else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [staging_net]

  publishing-worker:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    command: ["python", "-m", "app.workers.publishing"]
    env_file:
      - path: .env.staging
        required: false
    environment:
      <<: *api_env
    volumes:
      - staging_media_packages:/data/media/packages:ro
      - staging_media_originals:/data/media/originals:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "set -a; . /run/ifilm/runtime.env; set +a; python -c \"import sqlalchemy as sa; from app.core.config import get_settings; get_settings.cache_clear(); e=sa.create_engine(get_settings().database_url); e.connect().close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [staging_net]

  frontend:
    build:
      context: ../../app/frontend
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [staging_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [staging_net]

networks:
  staging_net:
    driver: bridge

volumes:
  staging_pg_data:
  staging_redis_data:
  staging_media_originals:
  staging_media_temp:
  staging_media_trailers:
  staging_media_subtitles:
  staging_media_posters:
  staging_media_backdrops:
  staging_media_packages:
  staging_artwork:
