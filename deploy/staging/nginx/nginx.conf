user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Large uploads (matches ENABLE_UPLOADS staging path).
  client_max_body_size 50g;
  client_body_timeout 3600s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;

  # Redact opaque playback tokens in /api/stream/{token}/… paths.
  # $uri is normalized (no query string). Never log raw stream credentials.
  map $uri $loggable_uri {
    default $uri;
    "~*^/api/stream/[A-Za-z0-9_-]{16,128}(/.*)?$" /api/stream/[REDACTED]$1;
  }

  # Strip common secret-bearing query parameters from access logs.
  map $args $loggable_args {
    default $args;
    "~*(?:^|&)(token|expires|access_token|refresh_token|playback_token|signature|sig)=" "";
  }

  # Prefer method + sanitized URI (+ args only when non-secret). Never use raw $request
  # for locations that may carry playback credentials.
  map $loggable_args $loggable_request_line {
    ""      "$request_method $loggable_uri $server_protocol";
    default "$request_method $loggable_uri?$loggable_args $server_protocol";
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$loggable_request_line" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  include /etc/nginx/conf.d/*.conf;
}
