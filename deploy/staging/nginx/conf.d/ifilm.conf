# HTTP staging front door. HTTPS-ready: see ifilm.https.conf.example.
# No direct access to MEDIA_ROOT / packages — only API-mediated streaming.

upstream ifilm_api {
  server backend-api:8000;
  keepalive 32;
}

upstream ifilm_frontend {
  server frontend:80;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Security headers (CSP is applied by the API for HTML when FRONTEND_DIST is used;
  # for SPA-from-frontend container we add a conservative baseline and pass API CSP).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Nginx liveness for compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Backend health (operational).
  location = /api/health {
    proxy_pass http://ifilm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # Protected streaming (tokenized /api/stream/*) — long timeouts, no disk buffering.
  location /api/stream/ {
    proxy_pass http://ifilm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass_header Content-Security-Policy;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Admin uploads — large bodies, extended timeouts (global client_max_body_size also applies).
  location /api/admin/media/ {
    proxy_pass http://ifilm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass_header Content-Security-Policy;
    client_max_body_size 50g;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering on;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://ifilm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Pass through backend CSP / security headers without overriding.
    proxy_pass_header Content-Security-Policy;
    proxy_pass_header Content-Security-Policy-Report-Only;

    proxy_buffering off;
    proxy_request_buffering on;
  }

  # Public artwork only (never packages/originals).
  location /artwork/ {
    proxy_pass http://ifilm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # Explicitly deny any attempt to hit media trees via nginx.
  location ^~ /media/ {
    return 404;
  }
  location ^~ /packages/ {
    return 404;
  }
  location ^~ /originals/ {
    return 404;
  }

  # SPA
  location / {
    proxy_pass http://ifilm_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
