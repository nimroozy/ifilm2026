services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ifilm}
      POSTGRES_USER: ${POSTGRES_USER:-ifilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - ifilm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ifilm}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      MEDIA_ROOT: /data/media
      ARTWORK_ROOT: /data/artwork
      # Legacy placeholder HLS URL removed; protected streaming uses /api/stream/{token}/…
      HLS_PUBLIC_BASE_URL: http://localhost:8000/api/stream
      ENABLE_UPLOADS: ${ENABLE_UPLOADS:-false}
      ENABLE_ENCODING: ${ENABLE_ENCODING:-false}
      ENABLE_CDN_SYNC: ${ENABLE_CDN_SYNC:-false}
      ENABLE_RADIUS_LOGIN: ${ENABLE_RADIUS_LOGIN:-false}
      ENABLE_MEDIA_PROCESSING: ${ENABLE_MEDIA_PROCESSING:-false}
      ENABLE_HLS_ENCODING: ${ENABLE_HLS_ENCODING:-false}
      ENABLE_LOCAL_STREAMING: ${ENABLE_LOCAL_STREAMING:-false}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-}
      PLAYBACK_TOKEN_TTL_SECONDS: ${PLAYBACK_TOKEN_TTL_SECONDS:-3600}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      RADIUS_ENABLED: ${RADIUS_ENABLED:-false}
      RADIUS_MODE: ${RADIUS_MODE:-live}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      RADIUS_MOCK_USERS: ${RADIUS_MOCK_USERS:-[]}
    volumes:
      - ./app/backend:/app
      # Uploads require API write access to originals + temp only.
      - ifilm_media_originals:/data/media/originals
      - ifilm_media_temp:/data/media/temp
      - ifilm_media_trailers:/data/media/trailers
      - ifilm_media_subtitles:/data/media/subtitles
      - ifilm_media_audio:/data/media/audio
      - ifilm_media_posters:/data/media/posters
      - ifilm_media_backdrops:/data/media/backdrops
      # Completed packages (+ encode workspaces under packages/work): READ-ONLY for API.
      - type: volume
        source: ifilm_media_packages
        target: /data/media/packages
        read_only: true
      # Public artwork only (never packages/originals).
      - type: volume
        source: ifilm_artwork
        target: /data/artwork
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Legacy ARQ EncodingJob worker — opt-in only. Not part of the canonical
  # media pipeline (docs/media/PIPELINE.md). Start with:
  #   docker compose --profile legacy-arq up worker
  worker:
    profiles: ["legacy-arq"]
    labels:
      - "ifilm.pipeline.role=legacy"
      - "ifilm.compose.profile=legacy-arq"
    build:
      context: ./app/backend
    command: arq app.workers.tasks.WorkerSettings
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ifilm}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      MEDIA_ROOT: /data/media
      ENABLE_UPLOADS: ${ENABLE_UPLOADS:-false}
      ENABLE_ENCODING: ${ENABLE_ENCODING:-false}
      ENABLE_CDN_SYNC: ${ENABLE_CDN_SYNC:-false}
      ENABLE_RADIUS_LOGIN: ${ENABLE_RADIUS_LOGIN:-false}
      ENABLE_MEDIA_PROCESSING: ${ENABLE_MEDIA_PROCESSING:-false}
      ENABLE_HLS_ENCODING: ${ENABLE_HLS_ENCODING:-false}
      RADIUS_MODE: ${RADIUS_MODE:-live}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
    volumes:
      - ./app/backend:/app
      - ifilm_media_originals:/data/media/originals
      - ifilm_media_temp:/data/media/temp
      - ifilm_media_packages:/data/media/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-processing-worker:
    # Canonical — always-on so `docker compose up` stays usable in development.
    labels:
      - "ifilm.pipeline.role=canonical"
      - "ifilm.compose.profile=always-on"
    build:
      context: ./app/backend
    command: python -m app.workers.media_processing
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ifilm}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      MEDIA_ROOT: /data/media
      ENABLE_MEDIA_PROCESSING: ${ENABLE_MEDIA_PROCESSING:-false}
      ENABLE_HLS_ENCODING: ${ENABLE_HLS_ENCODING:-false}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      MEDIA_PROCESSING_WORKER_ID: ${MEDIA_PROCESSING_WORKER_ID:-compose-media-1}
      MEDIA_PROCESSING_POLL_SECONDS: ${MEDIA_PROCESSING_POLL_SECONDS:-2}
      MEDIA_PROCESSING_STALE_AFTER_SECONDS: ${MEDIA_PROCESSING_STALE_AFTER_SECONDS:-120}
      MEDIA_PROCESSING_MAX_ATTEMPTS: ${MEDIA_PROCESSING_MAX_ATTEMPTS:-3}
      MEDIA_PROCESSING_RETRY_BASE_SECONDS: ${MEDIA_PROCESSING_RETRY_BASE_SECONDS:-30}
      MEDIA_PROCESSING_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROCESSING_PROBE_TIMEOUT_SECONDS:-120}
      MEDIA_PROCESSING_ENCODE_TIMEOUT_SECONDS: ${MEDIA_PROCESSING_ENCODE_TIMEOUT_SECONDS:-3600}
      MEDIA_PROCESSING_LOG_MAX_BYTES: ${MEDIA_PROCESSING_LOG_MAX_BYTES:-65536}
      HLS_SEGMENT_DURATION_SECONDS: ${HLS_SEGMENT_DURATION_SECONDS:-6}
      HLS_MAX_HEIGHT: ${HLS_MAX_HEIGHT:-1080}
      HLS_X264_PRESET: ${HLS_X264_PRESET:-veryfast}
    volumes:
      # Source uploads: read-only for encode/probe — all API write categories.
      - ifilm_media_originals:/data/media/originals:ro
      - ifilm_media_trailers:/data/media/trailers:ro
      - ifilm_media_subtitles:/data/media/subtitles:ro
      - ifilm_media_audio:/data/media/audio:ro
      - ifilm_media_posters:/data/media/posters:ro
      - ifilm_media_backdrops:/data/media/backdrops:ro
      # Packages + temporary encode workspaces under packages/work: read-write.
      - ifilm_media_packages:/data/media/packages
      - ifilm_media_temp:/data/media/temp
      - ./app/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.media_processing", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cdn-provisioning-worker:
    # Opt-in privileged worker for Admin → CDN → Servers provisioning (CDN-P1).
    #   docker compose --profile cdn up cdn-provisioning-worker
    # Requires ENABLE_CDN_PROVISIONING=true, INTEGRATION_SECRETS_KEY and an https
    # CDN_CENTRAL_BASE_URL reachable by CDN nodes. Never enable in the web container.
    profiles: ["cdn"]
    labels:
      - "ifilm.pipeline.role=cdn-provisioning"
      - "ifilm.compose.profile=cdn"
    build:
      context: ./app/backend
    command: python -m app.workers.cdn_provisioning
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ifilm}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      MEDIA_ROOT: /data/media
      ENABLE_CDN_PROVISIONING: ${ENABLE_CDN_PROVISIONING:-false}
      ENABLE_CDN_NODE_API: ${ENABLE_CDN_NODE_API:-false}
      INTEGRATION_SECRETS_KEY: ${INTEGRATION_SECRETS_KEY:-}
      CDN_CENTRAL_BASE_URL: ${CDN_CENTRAL_BASE_URL:-}
      CDN_MANAGEMENT_CIDRS: ${CDN_MANAGEMENT_CIDRS:-}
      CDN_SERVE_CIDRS: ${CDN_SERVE_CIDRS:-0.0.0.0/0,::/0}
      CDN_NODE_SERVE_PORT: ${CDN_NODE_SERVE_PORT:-8443}
      EDGE_GRANT_PUBLIC_KEY_PEM: ${EDGE_GRANT_PUBLIC_KEY_PEM:-}
      EDGE_GRANT_KEY_ID: ${EDGE_GRANT_KEY_ID:-eg1}
    volumes:
      - ./app/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.cdn_provisioning", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  publishing-worker:
    labels:
      - "ifilm.pipeline.role=canonical"
      - "ifilm.compose.profile=always-on"
    build:
      context: ./app/backend
    command: python -m app.workers.publishing
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ifilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ifilm}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      MEDIA_ROOT: /data/media
    volumes:
      - ./app/backend:/app
      - ifilm_media_packages:/data/media/packages:ro
      - ifilm_media_originals:/data/media/originals:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.publishing", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ifilm_pg:
  ifilm_media_originals:
  ifilm_media_temp:
  ifilm_media_trailers:
  ifilm_media_subtitles:
  ifilm_media_audio:
  ifilm_media_posters:
  ifilm_media_backdrops:
  ifilm_media_packages:
  ifilm_artwork:
