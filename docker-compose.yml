services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ifilm
      POSTGRES_USER: ifilm
      POSTGRES_PASSWORD: ifilm
    ports:
      - "5432:5432"
    volumes:
      - ifilm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifilm -d ifilm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./app/backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://ifilm:ifilm@postgres:5432/ifilm
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      HLS_PUBLIC_BASE_URL: http://localhost:8000/media/hls
      RADIUS_ENABLED: "false"
      RADIUS_MODE: mock
    volumes:
      - ./app/backend:/app
      - ifilm_media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./app/backend
    command: arq app.workers.tasks.WorkerSettings
    env_file:
      - ./app/backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://ifilm:ifilm@postgres:5432/ifilm
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      RADIUS_MODE: mock
    volumes:
      - ./app/backend:/app
      - ifilm_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ifilm_pg:
  ifilm_media:
