<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iFilm V2 Prototype — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./prototype.css" />
</head>
<body class="has-bottom-nav">
  <div class="proto-banner">G0 DESIGN PROTOTYPE · not production UI · real catalog from ifilm.af</div>
  <header class="header is-top" id="header">
    <a class="logo" href="#">iFilm</a>
    <nav class="nav-main" id="navMain" aria-label="Primary"></nav>
    <div class="nav-actions">
      <button class="icon-btn" type="button" aria-label="Search" title="Search">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      </button>
      <button class="icon-btn" type="button" id="langBtn" aria-label="Language">EN</button>
      <button class="icon-btn" type="button" aria-label="Profile"><span class="avatar"></span></button>
    </div>
  </header>

  <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Featured">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-scrim-side"></div>
    <div class="hero-scrim-bottom"></div>
    <div class="hero-vignette"></div>
    <div class="hero-content" id="heroContent"></div>
    <div class="hero-nav">
      <div class="hero-arrows">
        <button type="button" id="heroPrev" aria-label="Previous">‹</button>
        <button type="button" id="heroNext" aria-label="Next">›</button>
      </div>
    </div>
    <div class="dots" id="heroDots" role="tablist" aria-label="Hero slides"></div>
  </section>

  <main class="shelves" id="shelves"></main>

  <footer class="footer">
    <div class="footer-brand">iFilm</div>
    <div class="footer-by" id="footerBy">iFilm by Haroon Net</div>
    <div class="footer-grid">
      <div>
        <h3>Discover</h3>
        <a href="#">Movies</a><a href="#">Series</a><a href="#">Genres</a>
        <a href="#">Collections</a><a href="#">What to Watch</a><a href="#">Request Movie</a>
      </div>
      <div>
        <h3>Company</h3>
        <a href="#">About</a><a href="#">Contact</a><a href="#">Help / FAQ</a>
      </div>
      <div>
        <h3>Legal</h3>
        <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Copyright / DMCA</a><a href="#">Credits</a>
      </div>
    </div>
  </footer>

  <nav class="bottom-nav" aria-label="Mobile">
    <a class="active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10l8-6 8 6v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg><span data-i="Home">Home</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg><span data-i="Movies">Movies</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg><span data-i="Series">Series</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3-3"/></svg><span data-i="Search">Search</span></a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-5 7-5s5.5 2 7 5"/></svg><span>Profile</span></a>
  </nav>

  <script>
    const params = new URLSearchParams(location.search);
    const locale = (params.get('locale') || 'en').toLowerCase();
    let index = 0;
    let featured = [];
    let ui = {};

    function fmtRuntime(m) {
      if (!m) return '';
      const h = Math.floor(m / 60), min = m % 60;
      return h ? `${h}h ${min}m` : `${min}m`;
    }
    function cardHTML(m) {
      const badge = (m.dubbed && m.dubbed.length) ? `<span class="badge">DUB</span>` :
        (m.subtitles && m.subtitles.length ? `<span class="badge">SUB</span>` : '');
      const poster = m.poster
        ? `<img src="${m.poster}" alt="" loading="lazy" width="210" height="315" />`
        : `<div class="card-fallback">${(m.title || '?').slice(0,1)}</div>`;
      const meta = [m.year, m.rating ? `${m.rating}★` : null, (m.genres||[]).slice(0,2).join(' · ')].filter(Boolean).join(' · ');
      return `<article class="card" tabindex="0">
        <div class="card-poster">${poster}${badge}
          <div class="card-overlay">
            <div class="card-actions">
              <button class="mini play" type="button" aria-label="Play">▶</button>
              <button class="mini" type="button" aria-label="My List">＋</button>
              <button class="mini" type="button" aria-label="Details">ℹ</button>
            </div>
            <div class="card-meta-hover">${meta}</div>
          </div>
        </div>
        <h3 class="card-title">${m.title || ''}</h3>
        <p class="card-sub">${m.year || ''}${m.rating != null ? ` · ${m.rating}★` : ''}</p>
      </article>`;
    }

    function renderHero() {
      const m = featured[index];
      if (!m) return;
      const bg = document.getElementById('heroBg');
      bg.style.opacity = '0';
      setTimeout(() => {
        bg.style.backgroundImage = m.backdrop ? `url('${m.backdrop}')` : 'none';
        bg.style.opacity = '1';
      }, 160);
      const genres = (m.genres || []).slice(0, 3).join(' · ');
      document.getElementById('heroContent').innerHTML = `
        <h1 class="hero-title">${m.title}</h1>
        <p class="hero-overview">${m.overview || ''}</p>
        <div class="hero-meta">
          ${m.year ? `<span>${m.year}</span>` : ''}
          ${m.rating != null ? `<span class="rating">${m.rating} ★</span>` : ''}
          ${m.duration ? `<span>${fmtRuntime(m.duration)}</span>` : ''}
          ${genres ? `<span>${genres}</span>` : ''}
          ${(m.dubbed||[]).length ? `<span class="chip">Dubbed</span>` : ''}
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" type="button">▶ ${ui.play || 'Play'}</button>
          <button class="btn btn-secondary" type="button">${ui.info || 'More Info'}</button>
          <button class="btn btn-secondary" type="button">${ui.mylist || 'My List'}</button>
        </div>`;
      document.getElementById('heroDots').innerHTML = featured.map((_, i) =>
        `<button type="button" aria-label="Slide ${i+1}" aria-current="${i===index?'true':'false'}"></button>`
      ).join('');
      document.querySelectorAll('#heroDots button').forEach((b, i) => b.onclick = () => { index = i; renderHero(); });
    }

    function renderShelves(shelves) {
      document.getElementById('shelves').innerHTML = shelves.map((s, si) => `
        <section class="shelf" aria-labelledby="shelf-${si}">
          <div class="shelf-head">
            <h2 class="shelf-title" id="shelf-${si}">${s.title}</h2>
            <a class="see-all" href="#">${ui.seeAll || 'See all'}</a>
          </div>
          <div class="rail-wrap">
            <div class="rail" id="rail-${si}">${s.items.map(cardHTML).join('')}</div>
            <div class="rail-arrows">
              <button type="button" aria-label="Scroll previous" data-rail="${si}" data-dir="-1">‹</button>
              <button type="button" aria-label="Scroll next" data-rail="${si}" data-dir="1">›</button>
            </div>
          </div>
        </section>`).join('');
      document.querySelectorAll('.rail-arrows button').forEach(btn => {
        btn.onclick = () => {
          const rail = document.getElementById(`rail-${btn.dataset.rail}`);
          const dir = Number(btn.dataset.dir);
          const delta = dir * (rail.clientWidth * 0.8);
          // RTL: browsers already reverse scrollLeft semantics with dir=rtl on ancestors
          rail.scrollBy({ left: document.documentElement.dir === 'rtl' ? -delta : delta, behavior: 'smooth' });
        };
      });
    }

    Promise.any([
      fetch('./catalog-data.local.json').then(r => { if (!r.ok) throw 0; return r.json(); }),
      fetch('./catalog-data.json').then(r => r.json()),
    ]).then(data => {
      const pack = data.locales[locale] || data.locales.en;
      ui = pack.ui || {};
      featured = pack.home.featured || [];
      const rtl = locale === 'fa' || locale === 'ps';
      document.documentElement.lang = locale;
      document.documentElement.dir = rtl ? 'rtl' : 'ltr';
      document.getElementById('navMain').innerHTML = (ui.nav || []).map((label, i) =>
        `<a href="#" class="${i===0?'active':''}">${label}</a>`).join('');
      document.getElementById('langBtn').textContent = locale.toUpperCase();
      document.getElementById('footerBy').textContent = ui.by || 'iFilm by Haroon Net';
      document.querySelectorAll('.bottom-nav [data-i]').forEach(el => {
        const key = el.getAttribute('data-i');
        const map = { Home: ui.nav?.[0], Movies: ui.nav?.[1], Series: ui.nav?.[2], Search: ui.search };
        if (map[key]) el.textContent = map[key];
      });
      renderHero();
      renderShelves(pack.home.shelves || []);
    });

    document.getElementById('heroPrev').onclick = () => {
      index = (index - 1 + featured.length) % featured.length; renderHero();
    };
    document.getElementById('heroNext').onclick = () => {
      index = (index + 1) % featured.length; renderHero();
    };
    // Manual only — no autoplay timer
    window.addEventListener('scroll', () => {
      document.getElementById('header').classList.toggle('is-solid', scrollY > 24);
      document.getElementById('header').classList.toggle('is-top', scrollY <= 24);
    }, { passive: true });

    // Touch swipe for hero
    let tx = null;
    const hero = document.getElementById('hero');
    hero.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
    hero.addEventListener('touchend', e => {
      if (tx == null) return;
      const dx = e.changedTouches[0].screenX - tx;
      if (Math.abs(dx) > 40) {
        const rtl = document.documentElement.dir === 'rtl';
        if (dx < 0) index = (index + (rtl ? -1 : 1) + featured.length) % featured.length;
        else index = (index + (rtl ? 1 : -1) + featured.length) % featured.length;
        renderHero();
      }
      tx = null;
    }, { passive: true });
  </script>
</body>
</html>
