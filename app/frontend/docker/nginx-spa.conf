# Production-like SPA static hosting for the frontend container.
# Gzip is required for customer Fast3G; raw asset size ≠ network transfer size.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2
    application/wasm;

  # Prefer precompressed .gz when present (optional build step).
  gzip_static on;

  # Hashed assets — long cache; HTML must revalidate.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
