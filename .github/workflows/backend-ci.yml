name: Backend CI

on:
  push:
    paths:
      - 'app/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: app/backend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ifilm_ci
          POSTGRES_USER: ifilm_ci
          POSTGRES_PASSWORD: ci-strong-password-not-default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifilm_ci -d ifilm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DEBUG: "false"
      JWT_SECRET: ci-only-jwt-secret-value-with-32chars
      DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      REDIS_REQUIRED: "true"
      RADIUS_MODE: mock
      RADIUS_SECRET: ci-radius-secret
      RADIUS_MOCK_USERS: '[{"username":"mobin_user_001","password":"fixture-pass-ok","package":"Premium 50Mbps","branch":"Kabul","expiration":"2026-12-31"}]'
      ENABLE_RADIUS_LOGIN: "true"
      ENABLE_UPLOADS: "true"
      ENABLE_ENCODING: "true"
      ENABLE_CDN_SYNC: "true"
      ENABLE_MEDIA_PROCESSING: "true"
      ENABLE_HLS_ENCODING: "true"
      ENABLE_LOCAL_STREAMING: "true"
      PLAYBACK_TOKEN_SECRET: ci-playback-token-secret-32chars-min
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: ci-admin-password-ok
      MEDIA_ROOT: /tmp/ifilm-ci-media
      ARTWORK_ROOT: /tmp/ifilm-ci-artwork
      # Match local conftest isolation — full suite must not depend on SPA mount.
      FRONTEND_DIST: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg/ffprobe (required by media processing tests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app scripts tests

      - name: Python typecheck
        run: mypy app scripts

      - name: Full backend pytest suite
        env:
          # Unit tests use sqlite via conftest; Postgres URL remains for migration tests.
          DATABASE_URL: sqlite://
          REDIS_REQUIRED: "false"
          FRONTEND_DIST: ""
        run: |
          # Exact local parity command: full suite, zero failures required.
          pytest -q

      - name: Alembic heads
        run: |
          alembic heads | tee /tmp/alembic-heads.txt
          grep -q '014_tmdb_demo_metadata' /tmp/alembic-heads.txt

      - name: Alembic upgrade on empty PostgreSQL database
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
          PY
          alembic upgrade head
