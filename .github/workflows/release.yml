name: Release

# Production release publishing is restricted to version-tag pushes only.
# Signing uses the protected GitHub Environment `production-release`.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

env:
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
  SYFT_VERSION: "1.50.0"
  SYFT_SHA256: "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: test
      DEBUG: "false"
      JWT_SECRET: ci-only-jwt-secret-value-with-32chars
      DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      REDIS_REQUIRED: "true"
      RADIUS_MODE: mock
      RADIUS_SECRET: ci-radius-secret
      RADIUS_MOCK_USERS: '[{"username":"mobin_user_001","password":"fixture-pass-ok","package":"Premium 50Mbps","branch":"Kabul","expiration":"2026-12-31"}]'
      ENABLE_RADIUS_LOGIN: "true"
      ENABLE_UPLOADS: "true"
      ENABLE_ENCODING: "true"
      ENABLE_CDN_SYNC: "true"
      ENABLE_MEDIA_PROCESSING: "true"
      ENABLE_HLS_ENCODING: "true"
      ENABLE_LOCAL_STREAMING: "true"
      PLAYBACK_TOKEN_SECRET: ci-playback-token-secret-32chars-min
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: ci-admin-password-ok
      MEDIA_ROOT: /tmp/ifilm-ci-media
      ARTWORK_ROOT: /tmp/ifilm-ci-artwork
      FRONTEND_DIST: ""

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ifilm_ci
          POSTGRES_USER: ifilm_ci
          POSTGRES_PASSWORD: ci-strong-password-not-default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifilm_ci -d ifilm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Verify tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}"
          echo "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Install ffmpeg/ffprobe (required by media processing tests)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Backend quality (full suite)
        working-directory: app/backend
        env:
          DATABASE_URL: sqlite://
          REDIS_REQUIRED: "false"
          FRONTEND_DIST: ""
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          # Match Backend CI exactly — do not lint generated Alembic revision boilerplate.
          ruff check app scripts tests
          mypy app scripts
          # Exact local parity: full pytest suite, zero failures required.
          pytest -q
          alembic heads | tee /tmp/alembic-heads.txt
          grep -q '015_external_media_playability' /tmp/alembic-heads.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Frontend quality
        working-directory: app/frontend
        run: |
          # Match Frontend CI exactly.
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: ShellCheck installer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh packaging/installer/install_release.sh packaging/scripts/uninstall.sh

      - name: Packaging / security unit checks
        run: |
          python3 packaging/security/validate_trivy_ignores.py
          bash packaging/tests/test_install_env_reuse.sh
          bash packaging/tests/test_alembic_prod_exec.sh
          python3 packaging/tests/test_release_rejection.py -v
          python3 packaging/tests/test_image_digests.py -v

      - name: Compose validation
        run: |
          export POSTGRES_DB=ifilm POSTGRES_USER=ifilm POSTGRES_PASSWORD=x
          export REDIS_PASSWORD=x JWT_SECRET=x PLAYBACK_TOKEN_SECRET=x
          export IFILM_IMAGE_BACKEND_API="ghcr.io/nimroozy/ifilm2026/backend-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export IFILM_IMAGE_FRONTEND="ghcr.io/nimroozy/ifilm2026/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          export IFILM_ENV_FILE=/tmp/ifilm-compose-ci.env
          : > "$IFILM_ENV_FILE"
          docker compose -f packaging/compose/docker-compose.production.yml config >/dev/null

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Protected environment: require manual approval when configured.
    # Secret IFILM_RELEASE_SIGNING_KEY must live only in this environment.
    environment: production-release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      backend_ref: ${{ steps.digests.outputs.backend_ref }}
      frontend_ref: ${{ steps.digests.outputs.frontend_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LC}/backend-api" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LC}/frontend" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release archive (flat root)
        run: |
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/ifilm"
          rsync -a \
            --exclude .git \
            --exclude node_modules \
            --exclude '**/__pycache__' \
            --exclude '**/.venv' \
            --exclude 'app/frontend/dist' \
            --exclude 'deploy/staging/.env.staging' \
            --exclude 'deploy/staging/.env.staging.credentials' \
            ./ "$STAGE/ifilm/"
          printf '%s\n' "$VERSION" > "$STAGE/ifilm/packaging/VERSION"
          printf '%s\n' "${GITHUB_SHA}" > "$STAGE/ifilm/packaging/COMMIT_SHA"
          mkdir -p dist
          # Flat archive so /opt/ifilm/current/packaging resolves correctly.
          tar -C "$STAGE/ifilm" -czf "dist/ifilm-${VERSION}.tar.gz" .
          echo "ARCHIVE=dist/ifilm-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Build production images
        run: |
          docker build -f app/backend/Dockerfile.staging \
            -t "${BACKEND_IMAGE}:${VERSION}" \
            -t "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" \
            app/backend
          docker build -f app/frontend/Dockerfile.staging \
            -t "${FRONTEND_IMAGE}:${VERSION}" \
            -t "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" \
            app/frontend

      - name: Push images and resolve registry digests
        id: digests
        run: |
          set -euo pipefail
          docker push "${BACKEND_IMAGE}:${VERSION}"
          docker push "${FRONTEND_IMAGE}:${VERSION}"

          resolve_digest() {
            local image="$1"
            local tag="$2"
            local digest=""
            # Prefer registry inspection after push (authoritative RepoDigest).
            digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [[ -z "$digest" || "$digest" == "<nil>" ]]; then
              digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${tag}" 2>/dev/null | awk -F@ '{print $2}')"
            fi
            if [[ -z "$digest" || ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "ERROR: failed to resolve registry digest for ${image}:${tag}" >&2
              exit 1
            fi
            # Reject using local image ID as a substitute.
            local local_id
            local_id="$(docker image inspect --format='{{.Id}}' "${image}:${tag}")"
            if [[ "$digest" == "$local_id" ]]; then
              echo "ERROR: resolved digest equals local image ID; refusing fallback" >&2
              exit 1
            fi
            printf '%s' "$digest"
          }

          BACKEND_DIGEST="$(resolve_digest "${BACKEND_IMAGE}" "${VERSION}")"
          FRONTEND_DIGEST="$(resolve_digest "${FRONTEND_IMAGE}" "${VERSION}")"
          BACKEND_REF="${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          FRONTEND_REF="${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

          # Verify digests are pullable from GHCR by reference.
          docker pull "${BACKEND_REF}"
          docker pull "${FRONTEND_REF}"

          echo "backend_ref=${BACKEND_REF}" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=${FRONTEND_REF}" >> "$GITHUB_OUTPUT"
          echo "BACKEND_REF=${BACKEND_REF}" >> "$GITHUB_ENV"
          echo "FRONTEND_REF=${FRONTEND_REF}" >> "$GITHUB_ENV"
          printf '%s\n' "${BACKEND_REF}" > "dist/backend-image-ref.txt"
          printf '%s\n' "${FRONTEND_REF}" > "dist/frontend-image-ref.txt"

      - name: Install pinned Syft
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
          syft version

      - name: Install pinned Trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version

      - name: Generate SBOMs (required)
        run: |
          set -euo pipefail
          syft "${BACKEND_REF}" -o spdx-json > "dist/ifilm-${VERSION}-backend.sbom.spdx.json"
          syft "${FRONTEND_REF}" -o spdx-json > "dist/ifilm-${VERSION}-frontend.sbom.spdx.json"
          test -s "dist/ifilm-${VERSION}-backend.sbom.spdx.json"
          test -s "dist/ifilm-${VERSION}-frontend.sbom.spdx.json"

      - name: Validate ignore policy
        run: python3 packaging/security/validate_trivy_ignores.py

      - name: Vulnerability scan (hard gate)
        id: trivy_gate
        run: |
          set -euo pipefail
          mkdir -p dist/scans
          trivy image --scanners vuln --format json --output "dist/scans/backend-trivy.json" "${BACKEND_REF}"
          trivy image --scanners vuln --format json --output "dist/scans/frontend-trivy.json" "${FRONTEND_REF}"
          # Also emit human-readable summary for artifacts (does not gate).
          trivy image --scanners vuln --severity CRITICAL,HIGH --format table \
            --output "dist/scans/backend-trivy.txt" "${BACKEND_REF}" || true
          trivy image --scanners vuln --severity CRITICAL,HIGH --format table \
            --output "dist/scans/frontend-trivy.txt" "${FRONTEND_REF}" || true
          # Policy: unapproved CRITICAL always fail; HIGH fail only when FixedVersion exists.
          python3 packaging/security/gate_trivy_report.py \
            --report dist/scans/backend-trivy.json
          python3 packaging/security/gate_trivy_report.py \
            --report dist/scans/frontend-trivy.json

      - name: Upload scan and SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ env.VERSION }}
          path: |
            dist/scans/
            dist/ifilm-${{ env.VERSION }}-backend.sbom.spdx.json
            dist/ifilm-${{ env.VERSION }}-frontend.sbom.spdx.json
            dist/backend-image-ref.txt
            dist/frontend-image-ref.txt
          if-no-files-found: warn

      - name: Build and sign manifest
        env:
          IFILM_RELEASE_SIGNING_KEY: ${{ secrets.IFILM_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${IFILM_RELEASE_SIGNING_KEY}" ]]; then
            echo "IFILM_RELEASE_SIGNING_KEY is not configured in the production-release environment." >&2
            echo "See docs/deployment/ADMIN_SIGNING_SETUP.md" >&2
            exit 1
          fi
          # Never print key contents. Normalize into a mode-600 temp PEM file.
          KEY="$(mktemp)"
          chmod 600 "$KEY"
          KEY_PATH="$KEY" python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["IFILM_RELEASE_SIGNING_KEY"]
          text = raw.lstrip("\ufeff").strip()
          if (text.startswith('"') and text.endswith('"')) or (
              text.startswith("'") and text.endswith("'")
          ):
              text = text[1:-1].strip()
          text = (
              text.replace("\\r\\n", "\n")
              .replace("\\n", "\n")
              .replace("\r\n", "\n")
              .replace("\r", "\n")
          )
          path = Path(os.environ["KEY_PATH"])

          def write(pem: str) -> None:
              path.write_text(pem.strip() + "\n", encoding="utf-8")
              path.chmod(0o600)

          write(text)
          if "BEGIN" not in text:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", text), validate=False)
                  if b"BEGIN" in decoded:
                      write(decoded.decode("utf-8"))
                  else:
                      b64 = base64.encodebytes(decoded).decode("ascii")
                      write(
                          "-----BEGIN PRIVATE KEY-----\n"
                          + b64
                          + "-----END PRIVATE KEY-----"
                      )
              except Exception:
                  pass

          data = path.read_text(encoding="utf-8", errors="replace")
          # Diagnostics only — never print secret material.
          print(f"signing_key_bytes={len(data.encode())}")
          print(f"signing_key_has_begin_private={('BEGIN' in data and 'PRIVATE KEY' in data)}")
          print(f"signing_key_has_end_private={('END' in data and 'PRIVATE KEY' in data)}")
          PY
          if ! openssl pkey -in "$KEY" -noout >/dev/null 2>&1; then
            echo "IFILM_RELEASE_SIGNING_KEY is set but is not a usable private key PEM." >&2
            echo "Re-set the production-release secret with the full Ed25519 PKCS#8 PEM:" >&2
            echo "  -----BEGIN PRIVATE KEY----- / -----END PRIVATE KEY-----" >&2
            echo "See docs/deployment/ADMIN_SIGNING_SETUP.md" >&2
            shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
            exit 1
          fi
          CHANNEL=stable
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            CHANNEL=staging
          fi
          python3 packaging/release/build_manifest.py \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --archive "$ARCHIVE" \
            --migration-head 015_external_media_playability \
            --minimum-version 0.1.0 \
            --database-backup-required \
            --rollback-supported \
            --require-registry-digests \
            --image-digest "backend-api=${BACKEND_REF}" \
            --image-digest "frontend=${FRONTEND_REF}" \
            --image-digest "media-processing-worker=${BACKEND_REF}" \
            --image-digest "publishing-worker=${BACKEND_REF}" \
            --out dist/release-manifest.json
          python3 packaging/release/sign_manifest.py \
            --manifest dist/release-manifest.json \
            --key-file "$KEY" \
            --signature-out dist/release-manifest.json.sig
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
          sha256sum "$ARCHIVE" dist/release-manifest.json > dist/SHA256SUMS
          # Ensure logs/artifacts never contain private key material.
          if grep -R --exclude='*.sig' -E 'BEGIN .*PRIVATE KEY' dist/ >/dev/null 2>&1; then
            echo "refusing to publish: private key material detected under dist/" >&2
            exit 1
          fi
          echo "manifest_signed=true"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ifilm-${{ env.VERSION }}.tar.gz
            dist/release-manifest.json
            dist/release-manifest.json.sig
            dist/SHA256SUMS
            dist/ifilm-${{ env.VERSION }}-backend.sbom.spdx.json
            dist/ifilm-${{ env.VERSION }}-frontend.sbom.spdx.json
            dist/scans/backend-trivy.json
            dist/scans/frontend-trivy.json
            dist/backend-image-ref.txt
            dist/frontend-image-ref.txt
