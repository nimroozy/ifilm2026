name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: test
      DEBUG: "false"
      JWT_SECRET: ci-only-jwt-secret-value-with-32chars
      DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_DATABASE_URL: postgresql+psycopg2://ifilm_ci:ci-strong-password-not-default@localhost:5432/ifilm_ci
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      REDIS_REQUIRED: "true"
      RADIUS_MODE: mock
      RADIUS_SECRET: ci-radius-secret
      RADIUS_MOCK_USERS: '[{"username":"mobin_user_001","password":"fixture-pass-ok","package":"Premium 50Mbps","branch":"Kabul","expiration":"2026-12-31"}]'
      ENABLE_RADIUS_LOGIN: "true"
      ENABLE_UPLOADS: "true"
      ENABLE_ENCODING: "true"
      ENABLE_CDN_SYNC: "true"
      ENABLE_MEDIA_PROCESSING: "true"
      ENABLE_HLS_ENCODING: "true"
      ENABLE_LOCAL_STREAMING: "true"
      PLAYBACK_TOKEN_SECRET: ci-playback-token-secret-32chars-min
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: ci-admin-password-ok
      MEDIA_ROOT: /tmp/ifilm-ci-media
      ARTWORK_ROOT: /tmp/ifilm-ci-artwork

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ifilm_ci
          POSTGRES_USER: ifilm_ci
          POSTGRES_PASSWORD: ci-strong-password-not-default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifilm_ci -d ifilm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Verify tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}"
          echo "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Backend quality
        working-directory: app/backend
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          ruff check .
          mypy app
          pytest -q
          alembic heads | tee /tmp/alembic-heads.txt
          grep -q '012_system_update_notes' /tmp/alembic-heads.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Frontend quality
        working-directory: app/frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: ShellCheck installer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh packaging/installer/install_release.sh packaging/scripts/uninstall.sh

      - name: Compose validation
        run: |
          export POSTGRES_DB=ifilm POSTGRES_USER=ifilm POSTGRES_PASSWORD=x
          export REDIS_PASSWORD=x JWT_SECRET=x PLAYBACK_TOKEN_SECRET=x
          docker compose -f packaging/compose/docker-compose.production.yml config >/dev/null

      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/ifilm"
          rsync -a \
            --exclude .git \
            --exclude node_modules \
            --exclude '**/__pycache__' \
            --exclude '**/.venv' \
            --exclude 'app/frontend/dist' \
            ./ "$STAGE/ifilm/"
          mkdir -p dist
          tar -C "$STAGE" -czf "dist/ifilm-${VERSION}.tar.gz" ifilm
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCHIVE=dist/ifilm-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Build production images
        run: |
          docker build -f app/backend/Dockerfile.staging -t "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}" app/backend
          docker build -f app/frontend/Dockerfile.staging -t "ghcr.io/${GITHUB_REPOSITORY}/frontend:${VERSION}" app/frontend

      - name: Image digests
        id: digests
        run: |
          BACKEND_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}" 2>/dev/null || echo "")"
          if [[ -z "$BACKEND_DIGEST" ]]; then
            BACKEND_DIGEST="sha256:$(docker image inspect --format='{{.Id}}' "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}" | sed 's/^sha256://')"
          fi
          echo "backend=${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (best effort)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}" -o spdx-json > "dist/ifilm-${VERSION}.sbom.spdx.json"

      - name: Scan images (critical gate best effort)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --exit-code 1 --severity CRITICAL "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}"

      - name: Build and sign manifest
        env:
          IFILM_RELEASE_SIGNING_KEY: ${{ secrets.IFILM_RELEASE_SIGNING_KEY }}
        run: |
          python3 packaging/release/build_manifest.py \
            --version "$VERSION" \
            --channel stable \
            --archive "$ARCHIVE" \
            --migration-head 012_system_update_notes \
            --minimum-version 0.1.0 \
            --database-backup-required \
            --rollback-supported \
            --image-digest "backend-api=${{ steps.digests.outputs.backend }}" \
            --out dist/release-manifest.json
          if [[ -z "${IFILM_RELEASE_SIGNING_KEY}" ]]; then
            echo "IFILM_RELEASE_SIGNING_KEY secret is required to publish a signed release" >&2
            exit 1
          fi
          # Never echo the key. Write to a temp file with mode 600.
          KEY="$(mktemp)"
          printf '%s\n' "$IFILM_RELEASE_SIGNING_KEY" >"$KEY"
          chmod 600 "$KEY"
          python3 packaging/release/sign_manifest.py \
            --manifest dist/release-manifest.json \
            --key-file "$KEY" \
            --signature-out dist/release-manifest.json.sig
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
          sha256sum "$ARCHIVE" dist/release-manifest.json > dist/SHA256SUMS

      - name: Push images
        if: ${{ success() }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY}/backend-api:${VERSION}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/ifilm-${{ env.VERSION }}.tar.gz
            dist/release-manifest.json
            dist/release-manifest.json.sig
            dist/SHA256SUMS
            dist/ifilm-${{ env.VERSION }}.sbom.spdx.json
