name: Installer CI

on:
  push:
    paths:
      - 'install.sh'
      - 'packaging/**'
      - '.github/workflows/installer-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'packaging/**'
      - '.github/workflows/installer-ci.yml'
      - '.github/workflows/release.yml'

jobs:
  shell-and-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh packaging/installer/install_release.sh packaging/scripts/uninstall.sh

      - name: Compose config (immutable digest placeholders)
        run: |
          export POSTGRES_DB=ifilm POSTGRES_USER=ifilm POSTGRES_PASSWORD=x
          export REDIS_PASSWORD=x JWT_SECRET=x PLAYBACK_TOKEN_SECRET=x
          export IFILM_IMAGE_BACKEND_API="ghcr.io/nimroozy/ifilm2026/backend-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export IFILM_IMAGE_FRONTEND="ghcr.io/nimroozy/ifilm2026/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          export IFILM_ENV_FILE=/tmp/ifilm-compose-ci.env
          : > "$IFILM_ENV_FILE"
          docker compose -f packaging/compose/docker-compose.production.yml config >/dev/null

      - name: Public key fingerprint matches install.sh trust anchor
        run: |
          FP="$(openssl pkey -pubin -in packaging/keys/release-signing.pub -outform DER | sha256sum | awk '{print $1}')"
          grep -q "$FP" install.sh
          test "$FP" = "e7b365230a5b360f417532cba134fdb91eaa73b814163f3175a3f13d28286612"
          # Compromised identity must remain revoked and must not equal current key.
          grep -q '8c04b9141a9fe72346edf9e1f6bc27b0fbef3dc728d6e61124fb897e74ac1e26' packaging/keys/REVOKED_FINGERPRINTS.txt
          grep -q '8c04b9141a9fe72346edf9e1f6bc27b0fbef3dc728d6e61124fb897e74ac1e26' install.sh
          test "$FP" != "8c04b9141a9fe72346edf9e1f6bc27b0fbef3dc728d6e61124fb897e74ac1e26"

      - name: Trivy ignore policy validation
        run: python3 packaging/security/validate_trivy_ignores.py

      - name: Installer env reuse / wipe helpers
        run: bash packaging/tests/test_install_env_reuse.sh

      - name: Update agent unit tests
        run: python3 packaging/tests/test_update_agent_unit.py -v

      - name: Disposable signed-update simulation
        run: python3 packaging/tests/test_disposable_update_simulation.py -v

      - name: Release rejection matrix
        run: python3 packaging/tests/test_release_rejection.py -v

      - name: Image digest policy tests
        run: python3 packaging/tests/test_image_digests.py -v

      - name: Signing trust anchor / revocation
        run: python3 packaging/tests/test_signing_trust_anchor.py -v

      - name: Manifest build/sign roundtrip
        run: |
          KEY="$(mktemp)"
          openssl genpkey -algorithm Ed25519 -out "$KEY"
          chmod 600 "$KEY"
          mkdir -p /tmp/ifilm-rel
          echo hello > /tmp/ifilm-rel/payload.bin
          tar -C /tmp/ifilm-rel -czf /tmp/ifilm-rel/ifilm-0.0.0-test.tar.gz payload.bin
          BACKEND="ghcr.io/nimroozy/ifilm2026/backend-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          FRONTEND="ghcr.io/nimroozy/ifilm2026/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          python3 packaging/release/build_manifest.py \
            --version 0.0.0-test \
            --archive /tmp/ifilm-rel/ifilm-0.0.0-test.tar.gz \
            --require-registry-digests \
            --image-digest "backend-api=${BACKEND}" \
            --image-digest "frontend=${FRONTEND}" \
            --out /tmp/ifilm-rel/release-manifest.json
          python3 packaging/release/sign_manifest.py \
            --manifest /tmp/ifilm-rel/release-manifest.json \
            --key-file "$KEY" \
            --signature-out /tmp/ifilm-rel/release-manifest.json.sig
          openssl pkeyutl -verify -pubin \
            -inkey <(openssl pkey -in "$KEY" -pubout) \
            -sigfile /tmp/ifilm-rel/release-manifest.json.sig \
            -rawin \
            -in /tmp/ifilm-rel/release-manifest.json
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
